{% extends "base.html" %}
{% load contact_extras %}

{% block content %}
<section>
  <h3 class="border-b border-zinc-800">Dirección</h3>
  <div class="mt-4">
    {% include "contact/includes/map.html" %}
  </div>
</section>

<section class="mt-5">
  <h3 class="border-b border-zinc-800">Horario</h3>
  <div class="mt-4">
    {{ info.timetable|linebreaks }}
  </div>
</section>

<section class="mt-5">
  <h3 class="border-b border-zinc-800">Comunicación</h3>
  <div class="mt-4">
    <a class="link" href="mailto:{{ info.email }}">{{ info.email }}</a>
    <br>
    <a class="link" href="tel:{{ info.phone }}">{{ info.phone }}</a>
  </div>
</section>

<section class="mt-5">
  <h3 class="border-b border-zinc-800">Redes sociales</h3>
  <div class="mt-4">
    {% social_links %}
  </div>
</section>

{% endblock %}
