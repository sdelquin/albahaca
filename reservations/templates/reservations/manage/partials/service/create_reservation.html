<div id="service-action" class="sm:w-1/2">
  <h4 class="mb-3 text-lg sm:text-2xl">
    <i class="fa-solid fa-circle-plus text-accent"></i>
    Nueva reserva
  </h4>
  <form
    method="post"
    novalidate
    class="flex flex-col gap-2"
    hx-post="{% url 'reservations:create-service-reservation' day.date.year day.date.month day.date.day selected_service.code %}"
    hx-target="#service-action"
    hx-swap="outerHTML"
  >
    {% csrf_token %}
    {{ form }}

    <div class="mt-4 flex gap-4">
      <button
        type="button"
        class="button cancel"
        hx-get="{% url 'reservations:list-service-reservations' day.date.year day.date.month day.date.day selected_service.code %}"
        hx-target="#service-action"
        hx-swap="outerHTML"
        hx-push-url="true"
      >
        Cancelar
      </button>
      <input class="button" type="submit" value="Guardar cambios">
    </div>
  </form>
</div>
