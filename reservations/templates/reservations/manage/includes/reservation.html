<div class="w-fit rounded bg-emerald-950 shadow-lg overflow-hidden">
  <!-- Header -->
  <div class="flex justify-between items-center gap-1 bg-emerald-800 px-2 py-1">
    <p>{{ reservation.name }}</p>
  </div>
  <!-- Content -->
  <div class="flex flex-col gap-1 p-2">
    <span><i class="fa-solid fa-calendar"></i> {{ reservation.date|date:'d/m/Y' }}</span>
    <span><i class="fa-solid fa-clock"></i> {{ reservation.time_slot }}</span>
    <span><i class="fa-solid fa-user-group"></i> {{ reservation.party_size }} comensales</span>
    <span><i class="fa-solid fa-phone"></i> {{ reservation.phone }}</span>
    <span><i class="fa-solid fa-circle-info"></i> <span class="text-sm">{{ reservation.remarks|default:'No hay observaciones' }}</span></span>
  </div>
</div>
