<div
  x-show="showDeleteModal"
  x-cloak
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4"
>
  <div
    class="w-full max-w-md rounded-lg bg-zinc-800 p-6 shadow-xl"
    @click.outside="showDeleteModal = false"
  >
    <h3 class="text-xl font-bold">
      Borrar reserva
    </h3>

    <p class="mt-4">
      ¿Estás seguro de que quieres borrar la reserva de
      <strong>{{ reservation.name }}</strong>?
    </p>

    <form
      method="post"
      hx-post="{% url 'reservations:delete-reservation' reservation.pk %}"
      hx-push-url="true"
      hx-target="#service-action"
      hx-swap="beforeend"
      @htmx:after-request="showDeleteModal = false"
      class="mt-6 flex justify-end gap-2"
    >
      {% csrf_token %}

      <button
        type="button"
        class="button slim cancel"
        @click="showDeleteModal = false"
      >
        Cancelar
      </button>

      <button
        type="submit"
        class="button slim bg-red-800"
      >
        <i class="fa-regular fa-trash-can"></i>
        Borrar
      </button>
    </form>
  </div>
</div>
